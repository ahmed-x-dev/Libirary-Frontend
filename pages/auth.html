<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Tracker - Authentication</title>
    <link rel="stylesheet" href="/css/auth-style.css">
    <script src="/js/components/auth.js" defer></script>

</head>
<body>

    <div class="auth">
        <div class="auth__tabs">
            <button id="tab-login" class="auth__tab active">Log In</button>
            <button id="tab-register" class="auth__tab">Sign Up</button>
        </div>

        <form id="form-login" class="auth__form">
            <h2 class="auth__title">Welcome Back</h2>
            <p class="auth__subtitle">Enter your details to access your library</p>
            
            <div class="auth__field">
                <label class="auth__label" for="login-username">Username</label>
                <input class="auth__input" type="text" id="login-username" required autocomplete="username">
            </div>
            
            <div class="auth__field">
                <label class="auth__label" for="login-password">Password</label>
                <input class="auth__input" type="password" id="login-password" required autocomplete="current-password">
            </div>

            <button type="submit" class="auth__submit">Sign In</button>
            <p id="login-error" class="auth__message auth__message--error hidden"></p>
        </form>

        <form id="form-register" class="auth__form hidden">
            <h2 class="auth__title">Create Account</h2>
            <p class="auth__subtitle">Join and start tracking your media collection</p>
            
            <div class="auth__field">
                <label class="auth__label" for="reg-username">Username</label>
                <input class="auth__input" type="text" id="reg-username" required minlength="3">
            </div>

            <div class="auth__field">
                <label class="auth__label" for="reg-email">Email Address</label>
                <input class="auth__input" type="email" id="reg-email" required>
            </div>
            
            <div class="auth__field">
                <label class="auth__label" for="reg-password">Password</label>
                <input class="auth__input" type="password" id="reg-password" required minlength="6">
            </div>

            <button type="submit" class="auth__submit">Register</button>
            <p id="reg-error" class="auth__message auth__message--error hidden"></p>
            <p id="reg-success" class="auth__message auth__message--success hidden">Account created successfully! Switching to Login...</p>
        </form>
    </div>


</body>
</html>
